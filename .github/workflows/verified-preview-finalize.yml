name: Temporary Verified Preview Finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove writer then create final server-side marker commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          workflow_path=".github/workflows/verified-preview-finalize.yml"
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${GITHUB_HEAD_REF}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message='ci: remove temporary Chido preview finalizer' \
            -f sha="$workflow_sha" \
            -f branch="$GITHUB_HEAD_REF" >/dev/null

          marker_path=".github/VERIFIED_PREVIEW_SEAL.md"
          marker_content="$(printf '%s\n' '# Verified Preview Seal' '' 'This metadata-only marker is written by GitHub Actions after the temporary writer removes itself. Runtime code is unchanged.' '' "Source CI baseline: 2fb2c307a713a2eec6984b0917e83c4b2a0d8507" | base64 -w0)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker_path}" \
            -f message='ci: finalize Chido verified preview marker' \
            -f content="$marker_content" \
            -f branch="$GITHUB_HEAD_REF" >/dev/null

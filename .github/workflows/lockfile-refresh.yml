name: Temporary Lockfile Refresh

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify remediated lock
        run: |
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/nanoid']?.version !== '3.3.17') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/postcss']?.version !== '8.5.23') process.exit(1)"

      - name: Upload exact lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chido-package-lock-hardening
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

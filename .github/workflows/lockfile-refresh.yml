name: Temporary Lockfile Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Capture original lock digest
        run: echo "LOCK_BEFORE=$(sha256sum package-lock.json | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify remediated lock
        run: |
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/@babel/core']?.version !== '7.29.7') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/nanoid']?.version !== '3.3.17') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/postcss']?.version !== '8.5.23') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/js-yaml']?.version !== '4.3.1') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if(lock.packages['node_modules/brace-expansion']?.version !== '1.1.18') process.exit(1)"

      - name: Commit exact lockfile to hardening branch when changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          lock_after="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [[ "$LOCK_BEFORE" == "$lock_after" ]]; then
            echo "Lockfile already synchronized; no mutation required."
            exit 0
          fi
          blob_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package-lock.json?ref=${GITHUB_HEAD_REF}" --jq .sha)"
          export BLOB_SHA="$blob_sha"
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          payload = {
              "message": "security(deps): synchronize patched Chido lockfile",
              "content": base64.b64encode(Path("package-lock.json").read_bytes()).decode("ascii"),
              "sha": os.environ["BLOB_SHA"],
              "branch": os.environ["GITHUB_HEAD_REF"],
          }
          Path("/tmp/lock-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" --input /tmp/lock-payload.json >/dev/null

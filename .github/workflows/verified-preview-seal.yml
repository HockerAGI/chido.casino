name: Temporary Verified Preview Seal

on:
  pull_request:

permissions:
  contents: write

jobs:
  seal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove seal workflow in a verified server-side commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          path=".github/workflows/verified-preview-seal.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_HEAD_REF}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='ci: seal Chido preview with verified GitHub commit' \
            -f sha="$sha" \
            -f branch="$GITHUB_HEAD_REF" >/dev/null
